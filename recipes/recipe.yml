---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: nouelia
description: Fedora 44 bootc image with niri + Noctalia v5

# Fedora 44 is a hard requirement: noctalia only exists there, and niri 26.04
# is the first release with background-effect/blur.
base-image: ghcr.io/blue-build/base-images/fedora-base
image-version: 44

modules:
  - type: files
    files:
      - source: system
        destination: /

  # Terra via the upstream-recommended repofrompath + terra-release flow.
  - type: script
    snippets:
      - 'dnf5 -y install --nogpgcheck --repofrompath "terra,https://repos.fyralabs.com/terra$(rpm -E %fedora)" terra-release'

  - type: dnf
    install:
      # Keep niri's recommends (waybar, swaylock) out of the image.
      install-weak-deps: false
      packages:
        # desktop
        - niri
        - noctalia
        - wlroots # noctalia-greeter links libwlroots-0.20 directly.
        - xdg-desktop-portal-wlr
        - xdg-desktop-portal-gtk
        - xdg-desktop-portal-gnome
        
        # environment
        - fzf
        - ghostty
        - tuned-ppd
        - xwayland-satellite
        - polkit
        - xfce-polkit
        - fprintd-pam
        - xdg-user-dirs
        - greetd
        - dbus-tools # dbus-tools provides dbus-update-activation-environment for niri-session;
        - dbus-daemon # dbus-daemon provides dbus-run-session for the Noctalia greeter.
        - wl-clipboard
        - qt5-qtwayland
        - qt6-qtwayland
        - vulkan-validation-layers
        - vulkan-tools
        - google-noto-emoji-fonts
        - gnome-disk-utility
        - accountsservice
        - ddcutil
        - openssl
        - gnome-keyring
        - gnome-keyring-pam
        - upower
        - flatpak
        - vim
        - msedit
        - p7zip
        - distrobox
        - steam-devices
        
        # sound
        - wireplumber
        - pipewire
        - alsa-firmware
        - playerctl
        - pamixer
        - pulseaudio-utils

        # networking
        - NetworkManager
        - NetworkManager-openvpn
        - NetworkManager-openvpn-gnome
        - NetworkManager-openconnect
        - NetworkManager-openconnect-gnome
        - bluez
        - bluez-tools
        - firewall-config

        # file manager
        - thunar
        - thunar-archive-plugin 
        - thunar-volman
        - xarchiver
        - imv
        - p7zip
        - gvfs-mtp
        - gvfs-gphoto2
        - gvfs-smb
        - gvfs-nfs
        - gvfs-fuse
        - gvfs-archive

        # display
        - wlr-randr
        - wlsunset
        - brightnessctl
        - kanshi

        # theme and GUI
        - paper-icon-theme
        - papirus-icon-theme

        - repo: terra
          packages:
            - noctalia-greeter

  - type: default-flatpaks
    configurations:
      - scope: user
        repo:
          title: Flathub (user)
        install:
          - io.github.kolunmi.Bazaar
      
      - scope: system
        notify: true
        repo:
          title: Flathub (system)
        install:
          - com.github.tchx84.Flatseal
          - org.gnome.Loupe
          - org.gnome.Showtime
          - org.videolan.VLC
          - io.github.Qalculate
          - org.gnome.gedit
          - org.gnome.Music
          - net.nokyan.Resources
          - org.gnome.clocks

  # Fail the build on config errors instead of discovering them at first boot.
  - type: script
    snippets:
      - 'chmod 600 /etc/niri-image/firstboot.conf'
      - 'chmod 755 /usr/libexec/niri-firstboot'
      # niri 26.04 still uses a blanket systemctl import-environment, which is
      # deprecated in systemd 259. Use the upstream dbus/systemd import path.
      - |
        if grep -q '^    systemctl --user import-environment$' /usr/bin/niri-session; then
          sed -i 's|^    systemctl --user import-environment$|    if hash dbus-update-activation-environment 2>/dev/null; then dbus-update-activation-environment --systemd --all; else systemctl --user import-environment XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP XDG_SESSION_ID XDG_RUNTIME_DIR; fi|' /usr/bin/niri-session
        fi
      - '! grep -q "^    systemctl --user import-environment$" /usr/bin/niri-session'
      - 'command -v dbus-update-activation-environment'
      - 'command -v dbus-run-session'
      - 'niri validate --config /etc/niri/config.kdl'
      - 'noctalia --version'
      - 'test -x /usr/bin/noctalia-greeter-session'

  - type: systemd
    system:
      enabled:
        - greetd

  - type: signing
