---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: nouelia
description: Fedora 45 bootc image with niri + Noctalia v5

# Fedora 45 ships noctalia 5.x and niri 26.04 (the first release with
# background-effect/blur), so track it directly.
base-image: ghcr.io/blue-build/base-images/fedora-base
image-version: 45

modules:
  - from-file: common.yml

  # Fail the build on config errors instead of discovering them at first boot.
  - type: script
    scripts:
      - validate-image.sh

  - type: signing
